name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dev-install.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r dev-install.txt

      - name: Syntax check
        run: python -m py_compile popupapp.py app/main.py app/services/logging_setup.py app/ui/popup_ui.py tests/test_logging_setup.py tests/test_smoke.py

      - name: Run tests
        run: python -m pytest -q

  package-linux:
    name: Package Linux Binary
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dev-install.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r dev-install.txt

      - name: Build Linux binary
        run: |
          pyinstaller --clean --onefile --windowed --hidden-import=tkinter --name popupapp popupapp.py
          cp dist/popupapp dist/popupapp-linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: popupapp-linux
          path: dist/popupapp-linux
