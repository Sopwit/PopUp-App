name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Syntax check
        run: |
          python -m compileall src/ tests/

      - name: Run tests (Linux with xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run pytest -q

      - name: Run tests (macOS/Windows)
        if: runner.os != 'Linux'
        run: pytest -q

  package-linux:
    name: Package Linux AppImage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Build AppImage prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils
          curl -L --fail --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"

      - name: Build AppImage
        run: |
          APP_VERSION="${GITHUB_SHA::7}" \
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool" \
          APPIMAGETOOL_EXTRACT_AND_RUN=1 \
          make appimage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: popupapp-linux-appimage
          path: dist/PopUp-App-*.AppImage
