[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "super-popup-app"
version = "0.0.1"
description = "A secure, localized desktop greeting application built with Tkinter."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Emir" }]
keywords = ["desktop", "greeting", "popup", "tkinter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Tk",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Desktop Environment",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Sopwit/PopUp-App"
Repository = "https://github.com/Sopwit/PopUp-App"
Issues = "https://github.com/Sopwit/PopUp-App/issues"

[project.scripts]
popupapp = "popupapp.ui.app:run"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
popupapp = ["assets/*.png", "py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra -q --import-mode=importlib"
